name: Build Terrifier Widget APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Terrifier Icon
        run: |
          mkdir -p app/src/main/res/drawable
          curl -fsSL -A "Mozilla/5.0" "https://img.icons8.com/?size=512&id=62467&format=png" -o app/src/main/res/drawable/ic_terrifier.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerrifierWidget-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
